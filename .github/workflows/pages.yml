name: Publish YellowSubmariner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public website
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static public files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html app.js styles.css scenery.css home-intro.css home-photo-strip.css home-photo-strip.js japan-gallery.css japan-gallery.js japan-gallery-data.js japan-photo-credits.html .nojekyll _site/
          cp -R assets cms _site/
      - name: Upload public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
